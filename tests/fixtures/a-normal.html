<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>测试 A：正常复制</title>
<style>
  body { font: 16px/1.8 "PingFang SC", "Helvetica Neue", Arial, sans-serif; margin: 24px; }
  .para { margin: 12px 0; }
  .multi { font-family: "Hiragino Sans GB", "PingFang SC", sans-serif; }
  .mono { font-family: "Menlo", monospace; }
</style>
</head>
<body>
<h1>测试 A：普通网页复制</h1>
<p class="para" id="p1">人工智能正在改变世界。Hello, World! 2026 年 3 月 15 日，价格 1,234.56 元。</p>
<p class="para" id="p2">第一行文本<br>第二行文本，包含标点：你好，世界！以及问号？</p>
<p class="para multi" id="p3">跨节点文本：<span>前半段</span><span>中间段</span><span>后半段</span>结束。</p>
<p class="para mono" id="p4">等宽字体段落 ABC-123_xYz</p>
</body>
</html>
