name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mac-dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build DMG（native addon + electron-builder + afterPack sign）
        run: npm run dist:mac:arm64

      - name: Resolve DMG path
        id: dmg
        run: |
          DMG="$(find release -maxdepth 4 -name '*.dmg' -type f | head -1)"
          if [[ -z "$DMG" ]]; then
            echo "No .dmg under release/"
            find release -type f -maxdepth 5 || true
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Built: $DMG"

      - name: Publish GitHub Release（DMG 附件，不走 Actions Artifacts）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.path }}"
          TAG="dmg-${{ github.run_id }}"
          TITLE="DMG build ${{ github.run_id }} (${{ github.ref_name }})"
          NOTES="自动构建产物（dmg）。分支：\`${{ github.ref_name }}\`；提交：\`${{ github.sha }}\`。"
          gh release create "$TAG" "$DMG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
