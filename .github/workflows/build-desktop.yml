name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - mac

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 41 内置 Node 22;Actions 上的 Node 20 已进入退役期
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # 硬门禁:frame-bridge 的回归测试(跑不过就不发包)。
      # 盯的是"站点换掉嵌套 iframe 之后,映射还能不能送到新那层"——
      # 2026-10-23 真机故障就是这个:frame 名单过期 → 题目那层一份映射都收不到
      # → 复制出来还是密文。测试直接从 TS 源码现场构建(不读 vendor/ 产物),
      # 所以它测的永远是当前源码。
      - name: frame-bridge regression test
        run: node --test tools/verify/verify-frame-bridge.cjs

      # 硬门禁:页面守卫的回归测试(跑不过就不发包)。
      # 盯的是"换题之后新作用域会不会被发现、映射会不会真的到页面上":
      # 2026-10-23 末那次真机故障(换题后第 1 次复制成功、第 2 次复制出密文)
      # 就是守卫的三处根因,详见 ADR-0017。
      # 这套用例要读 vendor/page-guard.js(Electron 侧不入库、由 tools/build-vendor.mjs
      # 构建),所以先重建产物,测的才是**真正注入网页的那份**。
      - name: page-guard regression test
        run: |
          npm run build:vendor
          node --test tools/verify/verify-page-guard.cjs

      # 界面层的回归需要**构建出来的 dist/**(真正装进 App 的那份前端),
      # 所以先单独构建一次 —— 下面的 dist:mac:arm64 里也会再构建一次,
      # 重复的是那几十秒,换来的是"跑不过就不发包"这条门禁真的在打包**之前**。
      - name: Build frontend
        run: npm run build

      # 硬门禁:界面层的回归(跑不过就不发包)。
      # - 换页时内容区**底下**那条横向滚动条不许再出现
      #   (用户反馈「下面有个滑条在滑动」),画面横滑的动画不许丢;
      # - 录制的**单条删除**,以及「点自己界面上的按钮不算一次点击」的契约
      #   (开始录制不再由前端传那张会过期的矩形)。
      - name: UI regression test
        run: node --test tools/verify/verify-panel-transition.cjs tools/verify/verify-recording-ui.cjs

      # 硬门禁:回放的两道安全闸(2026-10-23 T0 事故)。
      # 回放的合成点击落点在自己窗口上 ⇒ 点到自己界面的「默认执行」⇒
      # 无限自激循环 ⇒ 疯狂敲键盘 ⇒ 整台机器卡死(用户被迫强制关机)。
      # 两道闸:重入保护(同一时刻最多一个回放)+ 落点在自己窗口上的点击不发出去。
      - name: playback guard regression test
        run: node --test tools/verify/verify-playback-guard.cjs

      - name: Build .app（native addon + electron-builder + afterPack sign）
        run: npm run dist:mac:arm64

      # 硬门禁:原生模块必须解包且能加载、引擎能从 asar 里跑起来。
      # 这条拦的是"装上之后功能是坏的"的老坑,见 ADR-0003。
      - name: Verify packaged app
        run: node tools/verify/verify-package.cjs

      # 交付约定:统一出 zip,不再产出 dmg（体积一样,解压即用）。
      # ditto 能保住 .app 里的符号链接（zip 命令行要额外加 -y）。
      - name: Package as zip
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "release/mac-arm64/模拟输入.app" "release/CampusNetworkConnector-mac-0.0.0.zip"
          ls -la release/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Network-Connector-Mac
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release（zip 附件，不走 Actions Artifacts）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="release/CampusNetworkConnector-mac-0.0.0.zip"
          TAG="mac-${{ github.run_id }}"
          TITLE="macOS build ${{ github.run_id }} (${{ github.ref_name }})"
          NOTES="自动构建产物（macOS app zip）。分支：\`${{ github.ref_name }}\`；提交：\`${{ github.sha }}\`。"
          gh release create "$TAG" "$ZIP" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
