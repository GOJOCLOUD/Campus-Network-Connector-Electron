name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - win

jobs:
  build-win:
    # windows-2022:node-gyp 在 VS2026(windows-latest 现在指向 windows-2025-vs2026)上
    # 找不到匹配的工具链,构建会失败 —— 这条线固定用 windows-2022。
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 41 内置 Node 22;Actions 上的 Node 20 已进入退役期
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # 硬门禁:frame-bridge 的回归测试(跑不过就不发包)。
      # 盯的是"站点换掉嵌套 iframe 之后,映射还能不能送到新那层"——
      # 2026-10-23 真机故障就是这个:frame 名单过期 → 题目那层一份映射都收不到
      # → 复制出来还是密文。测试直接从 TS 源码现场构建(不读 vendor/ 产物),
      # 所以它测的永远是当前源码。
      - name: frame-bridge regression test
        run: node --test tools/verify/verify-frame-bridge.cjs

      # 硬门禁:页面守卫的回归测试(跑不过就不发包)。
      # 盯的是"换题之后新作用域会不会被发现、映射会不会真的到页面上":
      # 2026-10-23 末那次真机故障(换题后第 1 次复制成功、第 2 次复制出密文)
      # 就是守卫的几处根因,详见 ADR-0017。
      # 这套用例要读 vendor/page-guard.js(Electron 侧不入库、由 tools/build-vendor.mjs
      # 构建),所以先重建产物,测的才是**真正注入网页的那份**。
      - name: page-guard regression test
        run: |
          npm run build:vendor
          node --test tools/verify/verify-page-guard.cjs

      # 硬门禁:浏览器修复扩展(复制修复)必须能构建出来(跑不过就不发包)。
      #
      # 2026-10-25 用户反馈:「在windows上那个把密文转化成明文的那个功能是失效的,
      # 没有用的」—— 根因不是"没写":apps/chromium-extension/(MV3、自带字形库、
      # 独立可运行)一直都在仓库里,是**两个 Windows 安装包里都没有它**
      # ⇒ 那条能力在 Windows 上实际等于零。
      #
      # 桌面程序**接管不了浏览器**(Windows 上没有 Safari、没有 Apple Events,
      # 没有能改写网页剪贴板事件的页面守卫通道)⇒ Windows 上的浏览器修复
      # **就是这个扩展**:用户把它装进 Chrome/Edge,网页上复制出来才是明文。
      #
      # 这条门禁盯的是**产物真的齐、真的装得进去**:manifest 是合法 MV3、
      # 三个脚本不是空壳、字形库能解开(坏 gzip ⇒ 扩展静默失能:
      # 后台拿不到参考字形 ⇒ 还原不出明文 ⇒ 用户看到的就是"没反应")。
      - name: Chromium extension build + verify
        shell: bash
        run: |
          if [ ! -f vendor/glyph-db-48.crdb.gz ]; then npm run build:vendor; fi
          npm run build:extension
          node --test tools/verify/verify-chromium-extension.cjs

      # 硬门禁:共享代码的两条不变量(跑不过就不发包)。
      #
      # ① 字形渲染的**栅格尺寸**必须与参考字形库一致 ——
      #    不一致 ⇒ 送进匹配器的位图与库里的字形**错位** ⇒ 最近邻全是噪声
      #    (实测落到「爫」「﹊」这类符号上,margin≈0)⇒ 永远判不出混淆
      #    ⇒ 复制出来还是密文,**而且全程不报错**。
      #    2026-10-25 实测踩过:渲染器 32×32、库 48×48。
      #
      # ② 扩展 ID 必须在 manifest / Rust / JS / 产物四处**算成同一个值** ——
      #    算错 ⇒ 注册表写到一把**没人认的键**上 ⇒ 开关显示「已接管」,
      #    浏览器里什么都没有(同样不报错)。
      - name: Glyph grid + extension ID gates
        run: node --test tools/verify/verify-glyph-grid.cjs tools/verify/verify-extension-id.cjs

      # 界面层的回归需要**构建出来的 dist/**(真正装进 App 的那份前端),
      # 所以先单独构建一次 —— 下面的 dist:win 里也会再构建一次,
      # 重复的是那几十秒,换来的是"跑不过就不发包"这条门禁真的在打包**之前**。
      - name: Build frontend
        run: npm run build

      # 界面层的门禁要真的开一个浏览器(puppeteer)。
      # 找浏览器的逻辑在 `tools/chrome-path.cjs`(唯一入口,跨平台):
      # 它除了 puppeteer 自己的缓存目录,还会兜底找 Windows 上系统自带的 Edge/Chrome。
      # 这里再**显式**装一次 puppeteer 要的那个版本 —— 装不上也不算失败
      # (网络抖一下不该拦住发包,共享模块还有系统浏览器兜底)。
      - name: Install Chrome for the UI regression tests
        shell: pwsh
        run: |
          $cache = Join-Path $env:USERPROFILE ".cache\puppeteer"
          $chrome = Get-ChildItem -Path $cache -Recurse -Filter "chrome.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $chrome) {
            Write-Host "puppeteer 的浏览器没装,现在装(装不上也不拦住:还有系统 Edge/Chrome 兜底)..."
            npx puppeteer browsers install chrome
            if ($LASTEXITCODE -ne 0) { Write-Host "装浏览器失败,交给 tools/chrome-path.cjs 兜底找系统浏览器" }
          } else {
            Write-Host "浏览器已就位: $($chrome.FullName)"
          }

      # 硬门禁:界面层的回归(跑不过就不发包)。
      # - 换页时内容区**底下**那条横向滚动条不许再出现
      #   (用户反馈「下面有个滑条在滑动」),画面横滑的动画不许丢;
      # - 录制的**单条删除**,以及「点自己界面上的按钮不算一次点击」的契约
      #   (开始录制不再由前端传那张会过期的矩形)。
      - name: UI regression test
        run: node --test tools/verify/verify-panel-transition.cjs tools/verify/verify-recording-ui.cjs

      # 硬门禁:平台界面自检(跑不过就不发包)。
      # 盯的是「该藏的步骤有没有真的藏起来」:
      #   - Windows 上不该出现的「模拟点击(录制)」与「默认执行(回放)」两步;
      #   - 原生模块好好的,却报一条红底白字「原生模块加载失败」;
      #   - 反过来也验:原生模块**真的坏了**时,那条横幅必须出现(免得它变成死代码)。
      # 这条门禁以前**只在本机跑**(没接进 CI)⇒ 它护的东西没人护。2026-10-24 补上。
      # 需要构建出来的 dist/ → 必须放在 "Build frontend" 之后。
      - name: Platform UI self-check
        run: node tools/verify/verify-ui-platforms.cjs

      # 硬门禁:回放的**重入保护**(2026-10-23 T0 事故)。
      # 回放的合成点击落点在自己窗口上 ⇒ 点到自己界面的「默认执行」⇒
      # 无限自激循环 ⇒ 疯狂敲键盘 ⇒ 整台机器卡死(用户被迫强制关机)。
      # 闸①(同一时刻最多一个回放)是纯逻辑、跨平台,Windows 线也必须有。
      - name: playback guard regression test
        run: node --test tools/verify/verify-playback-guard.cjs

      # 硬门禁:快捷键的 latch(触发许可)。
      # 盯的是「触发之后 Ctrl+D 整个按键就不再会继续影响它了,
      # 除非下一次重新按住 Ctrl」—— 触发一次就被消费掉,Control 不松开
      # 就不许再触发。而「默认执行」的动作是**回放**,一次误触发就是
      # 往用户屏幕上乱点一串合成点击 ⇒ 属于不能靠手测的那类闸。
      # (Windows 线现在也有 latch 了:win-input 的 watchControlKey
      #  用 GetAsyncKeyState 轮询做 Control 边沿观察。)
      - name: shortcut latch regression test
        run: node --test tools/verify/verify-shortcut-latch.cjs

      - name: Build native addon + renderer + NSIS installer
        run: npm run dist:win

      # 硬门禁:原生模块必须解包且能加载。
      # 这一条拦的是"装上之后 App 起不来"的老坑(原生模块被塞进 asar,
      # 顶层 require 直接抛错 → 主进程崩溃),见 ADR-0003。
      - name: Verify packaged app
        run: node tools/verify/verify-package-win.cjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Network-Connector-Win
          path: release/**/*.exe
          if-no-files-found: error

      # 只下了 .exe 的用户也得能拿到浏览器修复扩展 ⇒ 单独发一个附件。
      # (桌面交付包 `模拟输入-Windows-全部.zip` 里也带了一份。)
      - name: Pack Chromium extension for release
        shell: pwsh
        run: |
          Compress-Archive -Path "dist-core/chromium/*" -DestinationPath "browser-extension-chromium.zip" -Force
          Write-Host "browser-extension-chromium.zip: $((Get-Item browser-extension-chromium.zip).Length) bytes"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $EXE = Get-ChildItem -Path release -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $EXE) {
            Write-Error "No .exe found under release/"
            exit 1
          }
          $TAG = "win-${{ github.run_id }}"
          $TITLE = "Windows build ${{ github.run_id }} (${{ github.ref_name }})"
          $NOTES_FILE = [System.IO.Path]::GetTempFileName()
          Set-Content -Path $NOTES_FILE -Value "Auto-built Windows exe. Branch: ${{ github.ref_name }}  Commit: ${{ github.sha }}" -Encoding UTF8
          gh release create $TAG "$($EXE.FullName)" "browser-extension-chromium.zip" --title $TITLE --notes-file $NOTES_FILE --prerelease
